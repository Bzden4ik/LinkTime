<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkTime Agent - Настройки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .status-indicator {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.working {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-dot.distracted {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .status-dot.idle {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .status-text {
            flex: 1;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .connection-dot.connected {
            background: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LinkTime Desktop Agent</h1>
        <p class="subtitle">Мониторинг активности рабочего стола</p>

        <div class="status-indicator" id="statusIndicator">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text" id="statusText">Ожидание подключения...</div>
        </div>

        <div class="info-box">
            💡 <strong>Как получить ключ сессии:</strong><br>
            Откройте LinkTime в браузере → ⚙️ Настройки → "Показать ключ доступа"
        </div>

        <form id="configForm">
            <div class="form-group">
                <label for="sessionKey">Ключ сессии</label>
                <input 
                    type="text" 
                    id="sessionKey" 
                    placeholder="session_xxxxx_xxxxx"
                    required
                >
            </div>

            <button type="submit">Сохранить и подключиться</button>
        </form>

        <div class="connection-status">
            <div class="connection-dot" id="connectionDot"></div>
            <span id="connectionText">Не подключено</span>
        </div>

        <div class="success-message" id="successMessage">
            ✓ Настройки сохранены! Агент подключен.
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Загрузка текущей конфигурации
        ipcRenderer.send('get-config');

        ipcRenderer.on('config-data', (event, config) => {
            document.getElementById('sessionKey').value = config.sessionKey || '';
            
            // Проверяем подключение
            if (config.sessionKey) {
                ipcRenderer.send('test-connection');
            }
        });

        // Обновление статуса активности
        ipcRenderer.on('status-update', (event, data) => {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            statusDot.className = `status-dot ${data.status}`;
            
            let statusLabel = '';
            switch (data.status) {
                case 'working':
                    statusLabel = '🟢 Работа';
                    break;
                case 'distracted':
                    statusLabel = '🟡 Отвлечение';
                    break;
                case 'idle':
                    statusLabel = '🔴 Неактивен';
                    break;
            }
            
            statusText.textContent = `${statusLabel}: ${data.windowTitle}`;
        });

        // Статус подключения
        ipcRenderer.on('connection-status', (event, data) => {
            const connectionDot = document.getElementById('connectionDot');
            const connectionText = document.getElementById('connectionText');
            
            if (data.connected) {
                connectionDot.classList.add('connected');
                connectionText.textContent = 'Подключено к серверу';
            } else {
                connectionDot.classList.remove('connected');
                connectionText.textContent = 'Не подключено';
            }
        });

        // Сохранение конфигурации
        document.getElementById('configForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const sessionKey = document.getElementById('sessionKey').value.trim();
            
            if (!sessionKey) {
                alert('Пожалуйста, введите ключ сессии');
                return;
            }
            
            ipcRenderer.send('save-config', {
                sessionKey: sessionKey
            });
        });

        ipcRenderer.on('config-saved', () => {
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('show');
            
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Проверяем подключение через секунду
            setTimeout(() => {
                ipcRenderer.send('test-connection');
            }, 1000);
        });

        // Периодическая проверка подключения
        setInterval(() => {
            ipcRenderer.send('test-connection');
        }, 5000);
    </script>
</body>
</html>
