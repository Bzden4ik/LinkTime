# LinkTime — Nginx reverse proxy config
# Файл: /etc/nginx/sites-available/linktime.go-tit.ru

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name linktime.go-tit.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linktime.go-tit.ru;

    # SSL — Let's Encrypt (certbot заполнит автоматически)
    ssl_certificate /etc/letsencrypt/live/linktime.go-tit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linktime.go-tit.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Proxy to Node.js (port 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket (24 часа)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffering off for real-time
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check (без логирования)
    location /api/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
