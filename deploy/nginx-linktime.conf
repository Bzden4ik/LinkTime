# LinkTime — Nginx reverse proxy config
# Файл: /etc/nginx/sites-available/linktime.go-tit.ru
# ВАЖНО: certbot автоматически добавит SSL блок при запуске

server {
    listen 80;
    listen [::]:80;
    server_name linktime.go-tit.ru;

    # Для certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Node.js (port 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket (24 часа)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffering off for real-time
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /api/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
